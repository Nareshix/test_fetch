name: Scrape TMDB and Enrich with IMDb

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'What would you like to scrape?'
        required: true
        default: 'movies'
        type: choice
        options:
          - movies
          - shows
          - both

permissions:
  contents: write

jobs:
  # ==================== MOVIES ====================
  scrape-movies:
    if: inputs.target == 'movies' || inputs.target == 'both' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run Movies Scraper
        env:
          TMDB_API_KEY_MOVIES: ${{ secrets.TMDB_API_KEY_MOVIES }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
          PYTHONUNBUFFERED: "1"
        run: python -u movies.py

      - uses: actions/upload-artifact@v4
        with:
          name: movies-shard-${{ matrix.shard }}
          path: movies_shard_${{ matrix.shard }}.csv.gz
          retention-days: 1

  merge-movies:
    needs: scrape-movies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: movies-shard-*
          path: movie_shards
          merge-multiple: true

      - name: Merge and Enrich Movies
        run: python -u movies.py merge

      - name: Get current date tag
        id: date
        run: echo "tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: tmdb-movies-${{ steps.date.outputs.tag }}
          name: "TMDB & IMDb Movies Dataset (${{ steps.date.outputs.tag }})"
          draft: false
          prerelease: false
          files: movies.csv.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== SHOWS ====================
  scrape-shows:
    if: inputs.target == 'shows' || inputs.target == 'both'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run Shows Scraper
        env:
          TMDB_API_KEY_SHOWS: ${{ secrets.TMDB_API_KEY_SHOWS }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
          PYTHONUNBUFFERED: "1"
        run: python -u shows.py

      - uses: actions/upload-artifact@v4
        with:
          name: shows-shard-${{ matrix.shard }}
          path: |
            shows_shard_${{ matrix.shard }}.csv.gz
            seasons_shard_${{ matrix.shard }}.csv.gz
          retention-days: 1

  merge-shows:
    needs: scrape-shows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shows-shard-*
          path: show_shards
          merge-multiple: true

      - name: Merge and Enrich Shows
        run: python -u shows.py merge

      - name: Get current date tag
        id: date
        run: echo "tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: tmdb-shows-${{ steps.date.outputs.tag }}
          name: "TMDB & IMDb Shows Dataset (${{ steps.date.outputs.tag }})"
          draft: false
          prerelease: false
          files: |
            shows.csv.gz
            seasons.csv.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}