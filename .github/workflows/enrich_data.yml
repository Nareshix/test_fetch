name: Scrape TMDB Movies Daily

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        env:
          TMDB_API_KEY_MOVIES: ${{ secrets.TMDB_API_KEY_MOVIES }}
          PYTHONUNBUFFERED: "1"
        run: python -u movies.py

      - name: Get current date tag
        id: date
        run: echo "tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Files
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tmdb-movies-${{ steps.date.outputs.tag }}
          name: "TMDB Movies Complete Dataset (${{ steps.date.outputs.tag }})"
          draft: false
          prerelease: false
          files: movies.csv.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}